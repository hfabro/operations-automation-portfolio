name: Validate static portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, improve/executive-portfolio-quality, improve/workiq-evidence-enrichment]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Links, policies, metadata, and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run the dependency-free site validator
        run: node ./tools/validate-site.mjs
      - name: Verify synthetic report fixtures
        run: node ./tools/test-system-data.mjs

  browser:
    name: Responsive behavior and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare pinned development-only auditors
        run: |
          npm install --prefix "$RUNNER_TEMP/portfolio-qa" --no-save --package-lock=false --ignore-scripts playwright@1.62.1 axe-core@4.14.0
          "$RUNNER_TEMP/portfolio-qa/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify navigation, discovery, device modes, and responsive pages
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/portfolio-qa/node_modules/playwright
        run: node tools/test-browser.mjs

      - name: Verify gallery discovery and accessible presentation
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/portfolio-qa/node_modules/playwright
          AXE_CORE_PATH: ${{ runner.temp }}/portfolio-qa/node_modules/axe-core/axe.min.js
        run: node tools/test-gallery.mjs

      - name: Screen the portfolio shell for WCAG 2.2 AA issues
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/portfolio-qa/node_modules/playwright
          AXE_CORE_PATH: ${{ runner.temp }}/portfolio-qa/node_modules/axe-core/axe.min.js
        run: node tools/audit-accessibility.mjs
