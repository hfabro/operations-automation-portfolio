name: Validate static portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, phase3/business-time-foundation, improve/executive-portfolio-quality, improve/workiq-evidence-enrichment]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Links, policies, metadata, and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run the dependency-free site validator
        run: node ./tools/validate-site.mjs
      - name: Verify synthetic report fixtures
        run: node ./tools/test-system-data.mjs
      - name: Verify generated-page consistency and rebuild safety
        run: node ./tools/test-system-page-build.mjs
      - name: Verify canonical BI projection and rebuild safety
        run: node ./tools/test-bi-page-build.mjs
      - name: Verify inspectable BI dictionary and reconciliation evidence
        run: |
          node tools/test-bi-data-methods.cjs
          node tools/test-bi-table-export.cjs
      - name: Verify work evidence against current journal ancestry
        run: node ./tools/test-bi-work-context.cjs
      - name: Verify connected Finance resolution and legacy checkpoint parity
        run: node ./tools/test-bi-finance-resolution.cjs
      - name: Verify management measures, owners and unavailable sources
        run: node ./tools/test-bi-management.cjs
      - name: Verify explicit business-time fixture and financial/date controls
        run: |
          node tools/bi-prototype/tools/build_business_time_fixture.cjs --check
          node tools/test-bi-business-time.cjs
          node tools/test-bi-inbox.cjs
          node tools/test-bi-policy-review.cjs

  browser:
    name: Responsive behavior and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare pinned development-only auditors
        run: |
          npm install --prefix "$RUNNER_TEMP/portfolio-qa" --no-save --package-lock=false --ignore-scripts playwright@1.62.1 axe-core@4.14.0
          "$RUNNER_TEMP/portfolio-qa/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify navigation, discovery, device modes, and responsive pages
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/portfolio-qa/node_modules/playwright
        run: node tools/test-browser.mjs

      - name: Verify gallery discovery and accessible presentation
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/portfolio-qa/node_modules/playwright
          AXE_CORE_PATH: ${{ runner.temp }}/portfolio-qa/node_modules/axe-core/axe.min.js
        run: node tools/test-gallery.mjs

      - name: Screen the portfolio shell for WCAG 2.2 AA issues
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/portfolio-qa/node_modules/playwright
          AXE_CORE_PATH: ${{ runner.temp }}/portfolio-qa/node_modules/axe-core/axe.min.js
        run: node tools/audit-accessibility.mjs

      - name: Screen all demos and expanded help for accessibility
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/portfolio-qa/node_modules/playwright
          AXE_CORE_PATH: ${{ runner.temp }}/portfolio-qa/node_modules/axe-core/axe.min.js
        run: node tools/audit-demo-accessibility.mjs

  workflows:
    name: Workflow state, identity, and record integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare pinned browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/portfolio-qa" --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/portfolio-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify the maintained workflow contracts
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/portfolio-qa/node_modules/playwright
        run: node tools/run-regressions.mjs

  engines:
    name: Compatibility (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare pinned engine and accessibility tools
        run: |
          npm install --prefix "$RUNNER_TEMP/portfolio-qa" --no-save --package-lock=false --ignore-scripts playwright@1.62.1 axe-core@4.14.0
          "$RUNNER_TEMP/portfolio-qa/node_modules/.bin/playwright" install --with-deps "${{ matrix.engine }}"
      - name: Verify route layouts and representative workflows
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/portfolio-qa/node_modules/playwright
          BROWSER_ENGINE: ${{ matrix.engine }}
        run: node tools/test-engine-compatibility.mjs
      - name: Screen demo entry and expanded-help states
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/portfolio-qa/node_modules/playwright
          AXE_CORE_PATH: ${{ runner.temp }}/portfolio-qa/node_modules/axe-core/axe.min.js
          BROWSER_ENGINE: ${{ matrix.engine }}
        run: node tools/audit-demo-accessibility.mjs
      - name: Verify integrated BI journeys under the project path
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/portfolio-qa/node_modules/playwright
          AXE_CORE_PATH: ${{ runner.temp }}/portfolio-qa/node_modules/axe-core/axe.min.js
          BROWSER_ENGINE: ${{ matrix.engine }}
        run: node tools/test-bi-public.mjs --journeys-only
      - name: Verify pure business-time model parity
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/portfolio-qa/node_modules/playwright
          BROWSER_ENGINE: ${{ matrix.engine }}
        run: node tools/test-bi-business-time-browser.mjs
      - name: Verify business trends, source evidence and accessible date controls
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/portfolio-qa/node_modules/playwright
          AXE_CORE_PATH: ${{ runner.temp }}/portfolio-qa/node_modules/axe-core/axe.min.js
          BROWSER_ENGINE: ${{ matrix.engine }}
        run: node tools/test-bi-trends.mjs
      - name: Verify invoice source extraction, revisions and accessible inbox evidence
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/portfolio-qa/node_modules/playwright
          AXE_CORE_PATH: ${{ runner.temp }}/portfolio-qa/node_modules/axe-core/axe.min.js
          BROWSER_ENGINE: ${{ matrix.engine }}
        run: |
          node tools/test-bi-inbox-browser.mjs
          node tools/test-bi-ubl-inbox.mjs
          node tools/test-bi-table-export-browser.mjs
          node tools/test-bi-management-invoices.mjs
          node tools/test-bi-finance-resolution-browser.mjs
          node tools/test-bi-purchasing-recovery.mjs
          node tools/test-bi-batch-source.mjs
      - name: Verify independent Finance mapping decisions and original evidence
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/portfolio-qa/node_modules/playwright
          AXE_CORE_PATH: ${{ runner.temp }}/portfolio-qa/node_modules/axe-core/axe.min.js
          BROWSER_ENGINE: ${{ matrix.engine }}
        run: node tools/test-bi-policy-review.mjs

  bi:
    name: Connected BI contracts and purchasing journey
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare pinned development-only auditors
        run: |
          npm install --prefix "$RUNNER_TEMP/portfolio-qa" --no-save --package-lock=false --ignore-scripts playwright@1.62.1 axe-core@4.14.0
          "$RUNNER_TEMP/portfolio-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify data contracts, costs, sorting and connected recovery
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/portfolio-qa/node_modules/playwright
          AXE_CORE_PATH: ${{ runner.temp }}/portfolio-qa/node_modules/axe-core/axe.min.js
          PYTHON_COMMAND: python3
        run: node tools/bi-prototype/tools/run_checks.cjs
      - name: Verify generated BI routes, project-path handoffs and accessibility
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/portfolio-qa/node_modules/playwright
          AXE_CORE_PATH: ${{ runner.temp }}/portfolio-qa/node_modules/axe-core/axe.min.js
        run: node tools/test-bi-public.mjs
      - name: Verify pure business-time model parity
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/portfolio-qa/node_modules/playwright
        run: node tools/test-bi-business-time-browser.mjs
      - name: Verify business trends, source evidence and accessible date controls
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/portfolio-qa/node_modules/playwright
          AXE_CORE_PATH: ${{ runner.temp }}/portfolio-qa/node_modules/axe-core/axe.min.js
        run: node tools/test-bi-trends.mjs
      - name: Verify invoice source extraction, revisions and accessible inbox evidence
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/portfolio-qa/node_modules/playwright
          AXE_CORE_PATH: ${{ runner.temp }}/portfolio-qa/node_modules/axe-core/axe.min.js
        run: |
          node tools/test-bi-inbox-browser.mjs
          node tools/test-bi-ubl-inbox.mjs
          node tools/test-bi-table-export-browser.mjs
          node tools/test-bi-management-invoices.mjs
          node tools/test-bi-finance-resolution-browser.mjs
          node tools/test-bi-purchasing-recovery.mjs
          node tools/test-bi-batch-source.mjs
      - name: Verify independent Finance mapping decisions and original evidence
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/portfolio-qa/node_modules/playwright
          AXE_CORE_PATH: ${{ runner.temp }}/portfolio-qa/node_modules/axe-core/axe.min.js
        run: node tools/test-bi-policy-review.mjs
